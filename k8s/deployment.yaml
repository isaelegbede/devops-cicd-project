apiVersion: apps/v1
kind: Deployment
metadata:
  name: northstar-dashboard
  namespace: northstar
  labels:
    app.kubernetes.io/name: northstar-dashboard
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: northstar-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northstar-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/YOUR_DOCKERHUB_USER/northstar-dashboard:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: northstar-dashboard
  namespace: northstar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: northstar-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
