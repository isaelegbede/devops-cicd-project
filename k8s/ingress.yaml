apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northstar-dashboard
  namespace: northstar
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.example.com
      secretName: northstar-dashboard-tls
  rules:
    - host: dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: northstar-dashboard
                port:
                  name: http
